name: Deploy Superfinish Static Site

on:
  repository_dispatch:
    types: [wordpress-publish]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Point superfinish.be directly to WordPress origin (bypass Cloudflare Pages)
        run: echo "5.75.216.198 superfinish.be" | sudo tee -a /etc/hosts

      - name: Crawl WordPress site with wget
        run: |
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --no-verbose \
            --no-check-certificate \
            --reject "wp-login.php,wp-cron.php,xmlrpc.php,wp-signup.php" \
            --exclude-directories="/wp-admin,/wp-json,/wp-includes/js/tinymce" \
            --tries=3 \
            --timeout=30 \
            -P ./static \
            https://superfinish.be/ || EXIT=$?; [ "${EXIT:-0}" -le 8 ] && true

      - name: Remove WordPress-specific links from HTML
        run: |
          find ./static -name "*.html" | while read file; do
            sed -i \
              -e 's|href="[^"]*wp-admin[^"]*"||g' \
              -e 's|href="[^"]*wp-login[^"]*"||g' \
              -e 's|href="[^"]*xmlrpc\.php[^"]*"||g' \
              -e 's|action="[^"]*wp-admin[^"]*"||g' \
              -e 's|action="[^"]*wp-login[^"]*"||g' \
              "$file"
          done

      - name: Fix broken navigation links in HTML
        run: |
          find ./static -name "*.html" | while IFS= read -r file; do
            sed -i \
              -e 's|href="index\.html%3Fp=88\.html"|href="/wat-is-cerakote/"|g' \
              -e 's|href="index\.html?p=88\.html"|href="/wat-is-cerakote/"|g' \
              -e 's|href="index\.html%3Fp=198\.html"|href="/intropagina-2/"|g' \
              -e 's|href="index\.html?p=198\.html"|href="/intropagina-2/"|g' \
              -e 's|href="index\.html%3Fp=362\.html"|href="/cerakoat-jobs/"|g' \
              -e 's|href="index\.html?p=362\.html"|href="/cerakoat-jobs/"|g' \
              -e 's|href="index\.html%3Fp=406\.html"|href="/cerakoat-jobs-2/"|g' \
              -e 's|href="index\.html?p=406\.html"|href="/cerakoat-jobs-2/"|g' \
              -e 's|href="index\.html%3Fp=86\.html"|href="/contacteer-ons/"|g' \
              -e 's|href="index\.html?p=86\.html"|href="/contacteer-ons/"|g' \
              "$file"
          done
          echo "Navigation link fix complete"

      - name: Fix asset paths to be root-relative (fixes CSS/JS/images on all pages)
        run: |
          find ./static -name "*.html" | while IFS= read -r file; do
            python3 - "$file" << 'PYEOF'
import sys, re

path = sys.argv[1]
with open(path, 'r', encoding='utf-8', errors='replace') as f:
    html = f.read()

# Replace all relative wp-content/wp-includes paths with root-relative ones
# Handles: src=, href=, srcset=, with " or ' quotes, with ../ and ../../ prefixes
def fix_wp_paths(html):
    def replace_attr(m):
        attr = m.group(1)   # e.g. src, href, srcset
        quote = m.group(2)  # " or '
        value = m.group(3)  # the URL value
        # Strip leading ../ sequences
        clean = re.sub(r'^(\.\./)+', '', value)
        # Add leading / if starts with wp-content or wp-includes
        if clean.startswith('wp-content/') or clean.startswith('wp-includes/'):
            clean = '/' + clean
        return f'{attr}={quote}{clean}'

    # Match src=, href=, srcset= attributes
    pattern = r'(src|href|srcset)=(["\'])(\.\./)*wp-(content|includes)/[^"\'\s>]+'
    # We need to capture the full value for srcset (which can have multiple URLs)
    # Process srcset separately because it has multiple space-separated values
    def fix_srcset(m):
        quote = m.group(1)
        value = m.group(2)
        # Each entry in srcset is "url widthDescriptor"
        parts = value.split(',')
        fixed_parts = []
        for part in parts:
            part = part.strip()
            sub = part.split(' ', 1)
            url = re.sub(r'^(\.\./)+', '', sub[0])
            if url.startswith('wp-content/') or url.startswith('wp-includes/'):
                url = '/' + url
            fixed_parts.append(url + (' ' + sub[1] if len(sub) > 1 else ''))
        return f'srcset={quote}' + ', '.join(fixed_parts) + quote

    # Fix srcset first
    html = re.sub(r'srcset=(["\'])((?:(?:\.\./)*wp-(?:content|includes)/[^"\'\s>]+(?:\s+\d+[wx])?,?\s*)+)\1',
                  fix_srcset, html)

    # Fix src= and href= with ../ prefix
    html = re.sub(r'(src|href)=(["\'])(\.\./)+wp-(content|includes)/',
                  lambda m: f'{m.group(1)}={m.group(2)}/wp-{m.group(4)}/', html)

    # Fix src= and href= without prefix (relative, no leading /)
    html = re.sub(r'(src|href)=(["\'])wp-(content|includes)/',
                  lambda m: f'{m.group(1)}={m.group(2)}/wp-{m.group(3)}/', html)

    return html

fixed = fix_wp_paths(html)
with open(path, 'w', encoding='utf-8') as f:
    f.write(fixed)
PYEOF
          done
          echo "Asset path fix complete"

      - name: Fix neve script async to defer (ensures hamburger menu initializes)
        run: |
          find ./static -name "*.html" | while IFS= read -r file; do
            sed -i 's|neve-script-js" async>|neve-script-js" defer>|g' "$file"
          done
          echo "Neve script defer fix complete"

      - name: Rename versioned asset files to base names (handles both ? and %3F)
        run: |
          python3 << 'EOF'
          import os

          count = 0
          for root, dirs, files in os.walk('./static'):
              for f in files:
                  if '?' in f:
                      sep = '?'
                  elif '%3F' in f:
                      sep = '%3F'
                  else:
                      continue
                  old_path = os.path.join(root, f)
                  new_name = f.split(sep)[0]
                  new_path = os.path.join(root, new_name)
                  if new_name and old_path != new_path and not os.path.exists(new_path):
                      print(f"Renaming: {f} -> {new_name}")
                      os.rename(old_path, new_path)
                      count += 1
          print(f"Done — {count} files renamed")
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static/superfinish.be --project-name=superfinish-static
