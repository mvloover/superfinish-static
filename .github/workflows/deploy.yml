name: Deploy Superfinish Static Site

on:
  repository_dispatch:
    types: [wordpress-publish]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Crawl WordPress site with wget
        run: |
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --no-verbose \
            --reject "wp-login.php,wp-cron.php,xmlrpc.php,wp-signup.php" \
            --exclude-directories="/wp-admin,/wp-json,/wp-includes/js/tinymce" \
            --tries=3 \
            --timeout=30 \
            -P ./static \
            https://superfinish.be/ || EXIT=$?; [ "${EXIT:-0}" -le 8 ] && true

      - name: Remove WordPress-specific links from HTML
        run: |
          find ./static -name "*.html" | while read file; do
            sed -i \
              -e 's|href="[^"]*wp-admin[^"]*"||g' \
              -e 's|href="[^"]*wp-login[^"]*"||g' \
              -e 's|href="[^"]*xmlrpc\.php[^"]*"||g' \
              -e 's|action="[^"]*wp-admin[^"]*"||g' \
              -e 's|action="[^"]*wp-login[^"]*"||g' \
              "$file"
          done

      - name: Fix URL-encoded asset filenames (rename %3F files to base names)
        run: |
          find ./static -name "*%3F*" | while IFS= read -r f; do
            dir=$(dirname "$f")
            filename=$(basename "$f")
            newname=$(echo "$filename" | sed 's/%3F.*//')
            if [ -n "$newname" ] && [ "$filename" != "$newname" ]; then
              mv "$f" "$dir/$newname"
            fi
          done
          echo "Asset renaming complete"

      - name: Fix broken navigation links in HTML
        run: |
          find ./static -name "*.html" | while IFS= read -r file; do
            sed -i \
              -e 's|href="index\.html%3Fp=88\.html"|href="/wat-is-cerakote/"|g' \
              -e 's|href="index\.html%3Fp=198\.html"|href="/projecten/"|g' \
              -e 's|href="index\.html%3Fp=362\.html"|href="/we-coat-your-parts/"|g' \
              -e 's|href="index\.html%3Fp=406\.html"|href="/we-blast-your-parts/"|g' \
              -e 's|href="index\.html%3Fp=86\.html"|href="/contacteer-ons/"|g' \
              "$file"
          done
          echo "Navigation link fix complete"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: superfinish-static
          directory: static/superfinish.be
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
